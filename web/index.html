<div class="shell" id="shell">

<script>
(()=>{'use strict';
const TYPE_META={risk:{name:'风险',color:'#7c5ce0'},case:{name:'案例',color:'#2f76b7'},law:{name:'法条',color:'#9a7600'},stage:{name:'阶段',color:'#079b98'}};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'#';const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let payload=window.RISK_MAP_DATA||{risks:[],stages:[],laws:[],cases:[]};let graph=toGraph(payload);let nodeMap=new Map(),edgeMap=[],edgeById=new Map();let selectedId='RISK-DATA';let scale=1,panX=0,panY=0;let drag=null,animation=0,cameraAnimation=0;let saved=null;try{saved=JSON.parse(localStorage.getItem('risk-map-layout')||'null')}catch(_){localStorage.removeItem('risk-map-layout')}

function toGraph(d){const nodes=[],edges=[],seen=new Set(),add=(s,t,r)=>{const k=s+'|'+t+'|'+r;if(!seen.has(k)){seen.add(k);edges.push({id:'E'+edges.length,source:s,target:t,relation:r})}};d.risks.forEach(x=>{nodes.push({...x,id:x.code,label:x.name,type:'risk'});x.stage_ids.forEach(id=>add(x.code,id,'高发于'));x.law_ids.forEach(id=>add(x.code,id,'涉及法条'))});d.stages.forEach(x=>nodes.push({...x,label:x.name,type:'stage'}));d.laws.forEach(x=>nodes.push({...x,label:x.name+'\n'+x.article,type:'law'}));d.cases.forEach(x=>{nodes.push({...x,label:x.name,type:'case'});x.risk_codes.forEach(id=>add(x.id,id,'映射风险'));x.stage_ids.forEach(id=>add(x.id,id,'发生阶段'));x.law_ids.forEach(id=>add(x.id,id,'裁判依据'))});return{nodes,edges,meta:d.meta||{}}}
function init(){bind();if(saved?.filters){filters.risks=new Set(saved.filters.risks||filters.risks);filters.types=new Set(saved.filters.types||filters.types);filters.stages=new Set(saved.filters.stages||filters.stages)}renderFilters();setGraph(graph);if(saved?.selectedId&&nodeMap.has(saved.selectedId))selectedId=saved.selectedId;applyFilters();if(saved&&Number.isFinite(saved.scale)){cancelAnimationFrame(cameraAnimation);scale=saved.scale;panX=saved.panX||0;panY=saved.panY||0;updateTransform()}else if(innerWidth<=820){fit()}updateDataHealth(false);const staticMode=location.protocol==='file:'||location.hostname.endsWith('.github.io');if(staticMode){$('syncBtn').textContent=location.protocol==='file:'?'离线只读':'公开只读版';$('syncBtn').title='公开页面使用已脱敏的本地缓存；在线同步需在独立后端中完成'}if(location.protocol!=='file:'&&!location.hostname.endsWith('.github.io'))loadOnline();}
function bind(){$('allRisks').onclick=()=>{filters.risks=new Set(payload.risks.map(x=>x.code));renderFilters();applyFilters()};$('noRisks').onclick=()=>{filters.risks.clear();renderFilters();applyFilters()};document.querySelectorAll('[data-type-all]').forEach(b=>b.onclick=()=>{filters.types=new Set(b.dataset.typeAll==='1'?['risk','case','law','stage']:[]);renderFilters();applyFilters()});document.querySelectorAll('[data-stage-all]').forEach(b=>b.onclick=()=>{filters.stages=new Set(b.dataset.stageAll==='1'?payload.stages.map(x=>x.id):[]);renderFilters();applyFilters()});$('search').oninput=e=>{filters.query=e.target.value.trim().toLowerCase();applyFilters()};$('search').onkeydown=e=>{if(e.key==='Enter'){const hit=visibleNodes().find(n=>matchQuery(n));if(hit)selectNode(hit.id)}};$('zoomIn').onclick=()=>setZoom(scale+.15);$('zoomOut').onclick=()=>setZoom(scale-.15);$('zoomLabel').onclick=fit;$('fitBtn').onclick=fit;$('currentBtn').onclick=()=>selectNode(selectedId);$('relayoutBtn').onclick=()=>{saved=null;localStorage.removeItem('risk-map-layout');selectNode(selectedId);toast('已重新计算布局')};$('saveBtn').onclick=saveLayout;$('toggleRight').onclick=toggleRight;$('syncBtn').onclick=syncPkulaw;$('openFilters').onclick=()=>{const open=$('leftPanel').classList.toggle('open');$('openFilters').setAttribute('aria-expanded',String(open))};$('closeDetail').onclick=()=>$('rightPanel').classList.remove('open');$('graph').addEventListener('wheel',onWheel,{passive:false});$('graph').addEventListener('pointerdown',onPointerDown);window.addEventListener('pointermove',onPointerMove);window.addEventListener('pointerup',()=>drag=null);window.addEventListener('resize',()=>requestAnimationFrame(render));}
function renderFilters(){$('riskFilters').innerHTML=payload.risks.map(r=>`<button class="filter-chip" aria-pressed="${filters.risks.has(r.code)}" data-risk="${r.code}"><i class="swatch" style="background:${r.color}"></i><span>${esc(r.name)}</span><small class="origin-badge">${r.origin}</small></button>`).join('');document.querySelectorAll('[data-risk]').forEach(b=>b.onclick=()=>{filters.risks.has(b.dataset.risk)?filters.risks.delete(b.dataset.risk):filters.risks.add(b.dataset.risk);renderFilters();applyFilters()});const icons={risk:'risk',case:'case',law:'law',stage:'stage'};$('typeFilters').innerHTML=Object.entries(TYPE_META).map(([k,v])=>`<label class="checkrow"><input type="checkbox" data-type="${k}" ${filters.types.has(k)?'checked':''}><i class="shape-key ${icons[k]}"></i>${v.name}节点</label>`).join('');document.querySelectorAll('[data-type]').forEach(x=>x.onchange=()=>{x.checked?filters.types.add(x.dataset.type):filters.types.delete(x.dataset.type);applyFilters()});$('stageFilters').innerHTML=payload.stages.map(s=>`<label class="checkrow"><input type="checkbox" data-stage="${s.id}" ${filters.stages.has(s.id)?'checked':''}><i class="shape-key stage"></i>${esc(s.name)}</label>`).join('');document.querySelectorAll('[data-stage]').forEach(x=>x.onchange=()=>{x.checked?filters.stages.add(x.dataset.stage):filters.stages.delete(x.dataset.stage);applyFilters()})}
function setGraph(g){graph=g;nodeMap=new Map(g.nodes.map((n,i)=>{const angle=i*2.399963,radius=110+(i%8)*28;return[n.id,{...n,x:600+Math.cos(angle)*radius,y:400+Math.sin(angle)*radius*.72,tx:600,ty:400,vx:0,vy:0,visible:true}]}));edgeMap=g.edges.map(e=>({...e}));edgeById=new Map(edgeMap.map(e=>[e.id,e]));render();updateDataHealth($('mcpDot').classList.contains('ok'))}
function visibleNodes(){return [...nodeMap.values()].filter(n=>n.visible)}function matchQuery(n){if(!filters.query)return true;return [n.label,n.name,n.id,n.code,n.case_no,n.article,n.court,n.summary,n.cause,n.source_provider].filter(Boolean).join(' ').toLowerCase().includes(filters.query)}
function applyFilters(){const activeRisks=filters.risks;const activeStages=filters.stages;const searching=Boolean(filters.query);nodeMap.forEach(n=>{let v=filters.types.has(n.type)&&matchQuery(n);if(!searching){if(n.type==='risk')v=v&&activeRisks.has(n.id);if(n.type==='stage')v=v&&activeStages.has(n.id);if(n.type==='case')v=v&&(n.risk_codes||[]).some(x=>activeRisks.has(x))&&(n.stage_ids||[]).some(x=>activeStages.has(x));if(n.type==='law')v=v&&graph.edges.some(e=>(e.source===n.id&&activeRisks.has(e.target))||(e.target===n.id&&activeRisks.has(e.source)))}n.visible=v});const visible=visibleNodes();$('emptyGraph').classList.toggle('show',visible.length===0);if(!visible.length){selectedId='';$('centerNode').textContent='暂无匹配节点';$('graphCenter').textContent='暂无匹配节点';$('graphRelationCount').textContent='请调整左侧筛选条件';$('detail').innerHTML='<div class="notice">当前筛选组合没有可展示的节点。请重新选择风险类型、节点类型或生命周期阶段。</div>';render();return}if(!nodeMap.get(selectedId)?.visible)selectedId=visible[0].id;selectNode(selectedId,false)}
function neighbors(id){const set=new Set;edgeMap.forEach(e=>{if(e.source===id)set.add(e.target);if(e.target===id)set.add(e.source)});return set}
function selectNode(id,announce=true,focusCamera=true){const selected=nodeMap.get(id);if(!selected||!selected.visible)return;selectedId=id;const title=selected.name||selected.label;$('centerNode').textContent=title;$('graphCenter').textContent=title;const direct=neighbors(id);const vis=visibleNodes();const ring1=vis.filter(n=>direct.has(n.id));const ring2=vis.filter(n=>n.id!==id&&!direct.has(n.id));$('graphRelationCount').textContent=`${ring1.length} 条直接关联 · ${vis.length} 个可见节点`;selected.tx=600;selected.ty=400;placeRing(ring1,210,-Math.PI/2);placeCloud(ring2);const maxFocus=innerWidth<=820?1.28:1.08;const targetScale=Math.min(scale,maxFocus);if(focusCamera)animateCamera(targetScale,600*(1-targetScale),400*(1-targetScale));render();renderDetail(selected);animate();if(announce){$('live').textContent=`已将${title}设为中心节点，共${ring1.length}条直接关联`;if(innerWidth<=820)$('rightPanel').classList.add('open')}}
function placeRing(list,radius,start){const count=Math.max(1,list.length);list.sort((a,b)=>a.type.localeCompare(b.type)||a.id.localeCompare(b.id)).forEach((n,i)=>{const angle=start+i*Math.PI*2/count;const typeOffset=n.type==='case'?25:n.type==='law'?-15:0;n.tx=600+Math.cos(angle)*(radius+typeOffset);n.ty=400+Math.sin(angle)*(radius+typeOffset*.5)})}

function animate(){cancelAnimationFrame(animation);if(reduceMotion()){nodeMap.forEach(n=>{n.x=n.tx;n.y=n.ty;n.vx=n.vy=0});updateGeometry();return}let last=performance.now(),frames=0;const step=now=>{const dt=Math.min(2,(now-last)/16.667||1);last=now;let moving=false;nodeMap.forEach(n=>{const dx=n.tx-n.x,dy=n.ty-n.y;n.vx=(n.vx+dx*.034*dt)*Math.pow(.72,dt);n.vy=(n.vy+dy*.034*dt)*Math.pow(.72,dt);n.x+=n.vx*dt;n.y+=n.vy*dt;if(Math.abs(dx)+Math.abs(dy)+Math.abs(n.vx)+Math.abs(n.vy)>.45)moving=true;else{n.x=n.tx;n.y=n.ty;n.vx=n.vy=0}});updateGeometry();if(moving&&frames++<110)animation=requestAnimationFrame(step)};animation=requestAnimationFrame(step)}
function render(){const edgeRoot=$('edges'),labelRoot=$('edgeLabels'),nodeRoot=$('nodes'),direct=neighbors(selectedId),visibleIds=new Set(visibleNodes().map(n=>n.id));edgeRoot.innerHTML=edgeMap.filter(e=>visibleIds.has(e.source)&&visibleIds.has(e.target)).map(e=>{const a=nodeMap.get(e.source),b=nodeMap.get(e.target),active=e.source===selectedId||e.target===selectedId;return`<line data-edge="${esc(e.id)}" class="edge ${active?'active':'dim'}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`}).join('');labelRoot.innerHTML=edgeMap.filter(e=>visibleIds.has(e.source)&&visibleIds.has(e.target)&&(e.source===selectedId||e.target===selectedId)).map(e=>{const a=nodeMap.get(e.source),b=nodeMap.get(e.target);return`<text data-edge="${esc(e.id)}" class="edge-label active" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-4}">${esc(e.relation)}</text>`}).join('');nodeRoot.innerHTML=visibleNodes().map(n=>nodeSvg(n,n.id!==selectedId&&!direct.has(n.id))).join('');nodeRoot.querySelectorAll('.node').forEach(g=>{g.addEventListener('click',e=>{e.stopPropagation();selectNode(g.dataset.id)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(g.dataset.id)}})});$('graphStats').textContent=`${visibleIds.size} 个节点 · ${edgeRoot.children.length} 条关系`;updateTransform()}
function updateGeometry(){document.querySelectorAll('#nodes .node').forEach(el=>{const n=nodeMap.get(el.dataset.id);if(n)el.setAttribute('transform',`translate(${n.x},${n.y})`)});document.querySelectorAll('#edges [data-edge]').forEach(el=>{const e=edgeById.get(el.dataset.edge),a=e&&nodeMap.get(e.source),b=e&&nodeMap.get(e.target);if(a&&b){el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y)}});document.querySelectorAll('#edgeLabels [data-edge]').forEach(el=>{const e=edgeById.get(el.dataset.edge),a=e&&nodeMap.get(e.source),b=e&&nodeMap.get(e.target);if(a&&b){el.setAttribute('x',(a.x+b.x)/2);el.setAttribute('y',(a.y+b.y)/2-4)}})}
function nodeSvg(n,dim){const selected=n.id===selectedId;const color=n.type==='risk'?(n.color||TYPE_META.risk.color):TYPE_META[n.type].color;let shape='';if(n.type==='law')shape=`<rect class="node-shape" x="-17" y="-17" width="34" height="34" rx="4" fill="${color}" transform="rotate(45)"></rect>`;else if(n.type==='stage')shape=`<path class="node-shape" d="M-23,-14 L0,-27 L23,-14 L23,14 L0,27 L-23,14 Z" fill="${color}"></path>`;else if(n.type==='risk')shape=`<rect class="node-shape" x="-25" y="-25" width="50" height="50" rx="11" fill="${color}"></rect>`;else shape=`<circle class="node-shape" r="${selected?25:19}" fill="${color}"></circle>`;const full=n.name||n.label,label=full.replace(/（.*?）/g,'').slice(0,n.type==='case'?12:11),sub=n.type==='risk'?n.code:n.type==='case'?(n.year||n.kind||'案例'):n.type==='law'?n.article:n.type==='stage'?'生命周期':'';return`<g class="node ${selected?'selected':''} ${dim?'dim':''}" data-id="${esc(n.id)}" transform="translate(${n.x},${n.y})" tabindex="0" role="button" aria-label="${esc(TYPE_META[n.type].name+'：'+full)}"><title>${esc(full)}</title><circle class="node-hit" r="43"></circle><circle class="halo" r="34"></circle>${shape}<text class="node-label" y="${n.type==='case'?36:43}">${esc(label)}</text><text class="node-sub" y="${n.type==='case'?48:55}">${esc(String(sub).slice(0,24))}</text></g>`}
function renderDetail(n){const related=edgeMap.filter(e=>e.source===n.id||e.target===n.id).map(e=>{const other=nodeMap.get(e.source===n.id?e.target:e.source);return other?{node:other,relation:e.relation}:null}).filter(Boolean).sort((a,b)=>a.node.type.localeCompare(b.node.type));const badge=n.type==='risk'?`<span class="tag ${n.origin==='外源'?'external':''}">${esc(n.origin)}风险</span>`:`<span class="tag">${TYPE_META[n.type].name}节点</span>`;let special='';if(n.type==='risk')special=`<div class="detail-block"><div class="detail-label">查询关键词 query</div><div class="keyword-list">${(n.query||[]).map(x=>`<span class="keyword">${esc(x)}</span>`).join('')}</div></div><div class="detail-block"><div class="detail-label">案由关键词 cause <span class="signal">最强判定信号</span></div><div class="keyword-list">${(n.cause||[]).map(x=>`<span class="keyword strong">${esc(x)}</span>`).join('')}</div></div>`;if(n.type==='case'){const evidence=Object.entries(n.tag_evidence||{}).map(([code,item])=>{const risk=payload.risks.find(r=>r.code===code);return`<div class="evidence-card"><b>${esc(risk?.name||code)}</b> · ${esc(item.signal||'语义检索')}${item.matched?`<br>命中：${esc(item.matched)}`:''}</div>`}).join('');special=`<div class="detail-block"><div class="detail-label">案件信息</div><p class="detail-copy"><b>${esc(n.case_no||'案号待同步')}</b>${n.cause?`<br>案由：${esc(n.cause)}`:''}${n.court?`<br>${esc(n.court)}`:''}${n.year?` · ${esc(n.year)}`:''}</p>${evidence}</div>`}if(n.type==='law')special=`<div class="detail-block"><div class="detail-label">对应条款</div><p class="detail-copy">${esc(n.article||'')}</p></div>`;const sources=n.source_url?[n]:related.map(x=>x.node).filter(x=>x.source_url).slice(0,6),detail=$('detail');detail.innerHTML=`<div class="node-head"><div><h2 class="node-title">${esc(n.name||n.label)}</h2><div class="node-code">${esc(n.code||n.id)}</div></div>${badge}</div><div class="detail-block"><div class="detail-label">${n.type==='case'?'裁判/事件摘要':n.type==='law'?'条文要点':'直观定义'}</div><p class="detail-copy">${esc(n.definition||n.summary||n.description||'暂无说明')}</p></div>${special}<div class="detail-block"><div class="detail-label">相关关系 <span>${related.length}</span></div><div class="connections">${related.slice(0,18).map(x=>`<button class="connection" data-related="${esc(x.node.id)}"><i class="swatch" style="background:${x.node.color||TYPE_META[x.node.type].color}"></i><span class="connection-main"><div class="connection-name">${esc(x.node.name||x.node.label)}</div><div class="connection-rel">${esc(x.relation)} · ${TYPE_META[x.node.type].name}</div></span></button>`).join('')||'<div class="helper">暂无关系</div>'}</div></div><div class="detail-block"><div class="detail-label">来源与溯源</div>${sources.length?sources.map(s=>`<div class="source-card"><span class="source-provider">${esc(s.source_provider||'公开来源')}</span><a href="${esc(safeUrl(s.source_url))}" target="_blank" rel="noopener noreferrer"><span>打开${esc(s.source_provider==='北大法宝 MCP'?'北大法宝原文':s.name||'官方来源')}</span><span aria-hidden="true">↗</span></a><div class="source-meta">${esc([s.case_no,s.court,s.year].filter(Boolean).join(' · ')||s.article||s.summary||'公开来源')}</div></div>`).join(''):'<div class="notice">此节点暂无外部链接；通过北大法宝 MCP 同步后将自动补充案号、来源和原文链接。</div>'}</div>`;detail.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>selectNode(b.dataset.related));if(!reduceMotion())detail.animate([{opacity:.15,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:260,easing:'cubic-bezier(.16,1,.3,1)'})}
function updateTransform(){$('viewport').setAttribute('transform',`translate(${panX} ${panY}) scale(${scale})`);$('zoomLabel').textContent=Math.round(scale*100)+'%'}
function animateCamera(nextScale,nextX,nextY){cancelAnimationFrame(cameraAnimation);nextScale=Math.max(.45,Math.min(2,nextScale));if(reduceMotion()){scale=nextScale;panX=nextX;panY=nextY;updateTransform();return}const start=performance.now(),fromScale=scale,fromX=panX,fromY=panY;const step=now=>{const t=Math.min(1,(now-start)/320),e=1-Math.pow(1-t,4);scale=fromScale+(nextScale-fromScale)*e;panX=fromX+(nextX-fromX)*e;panY=fromY+(nextY-fromY)*e;updateTransform();if(t<1)cameraAnimation=requestAnimationFrame(step)};cameraAnimation=requestAnimationFrame(step)}
function setZoom(v){const next=Math.max(.45,Math.min(2,v));animateCamera(next,600*(1-next),400*(1-next))}function fit(){animateCamera(1,0,0)}
function onWheel(e){e.preventDefault();setZoom(scale+(e.deltaY<0?.1:-.1))}function onPointerDown(e){if(e.target.closest('.node'))return;cancelAnimationFrame(cameraAnimation);drag={x:e.clientX,y:e.clientY,panX,panY};$('graph').classList.add('panning');e.currentTarget.setPointerCapture?.(e.pointerId)}function onPointerMove(e){if(!drag)return;panX=drag.panX+(e.clientX-drag.x);panY=drag.panY+(e.clientY-drag.y);updateTransform()}window.addEventListener('pointerup',()=>{$('graph').classList.remove('panning')});
function saveLayout(){localStorage.setItem('risk-map-layout',JSON.stringify({selectedId,scale,panX,panY,filters:{risks:[...filters.risks],types:[...filters.types],stages:[...filters.stages]}}));toast('布局已保存在本机浏览器')}
function toggleRight(){const r=$('rightPanel'),collapsed=r.classList.toggle('collapsed');$('shell').classList.toggle('right-collapsed',collapsed);$('toggleRight').textContent=collapsed?'展开右栏':'收起右栏';setTimeout(()=>requestAnimationFrame(render),280)}
function updateDataHealth(online){const cases=[...nodeMap.values()].filter(n=>n.type==='case'),laws=[...nodeMap.values()].filter(n=>n.type==='law'),pkulaw=cases.filter(n=>n.source_provider==='北大法宝 MCP').length,healthy=online||pkulaw>0;$('topStatusDot').className='status-dot '+(healthy?'ok':'warn');$('topStatusText').textContent=online?'北大法宝已连接':pkulaw?'法宝离线缓存':'离线知识库';$('topStats').textContent=`${cases.length} 案例 · ${laws.length} 法条`;$('mcpDot').className='status-dot '+(healthy?'ok':'warn');if(!online)$('mcpText').textContent=pkulaw?`离线缓存 · ${pkulaw} 条法宝案例`:'离线案例种子'}
async function loadOnline(){try{const res=await fetch('/api/risk-map');if(!res.ok)return;const data=await res.json();if(data.nodes&&data.edges){payload.risks=data.taxonomy||payload.risks;setGraph(data);renderFilters();applyFilters();const m=data.pkulaw||{};$('mcpDot').className='status-dot '+(m.configured?'ok':'warn');$('mcpText').textContent=m.configured?'北大法宝 MCP 已就绪':$('mcpText').textContent;$('syncBtn').disabled=!m.configured;$('syncBtn').title=m.configured?'按当前风险筛选同步案例':'请在 .env 中配置 PKULAW_ACCESS_TOKEN';updateDataHealth(Boolean(m.configured))}}catch(e){updateDataHealth(false)}}
async function syncPkulaw(){const b=$('syncBtn'),codes=[...filters.risks],progress=$('syncProgress');if(!codes.length){toast('请先选择至少一种风险类型');return}b.disabled=true;const old=b.textContent;b.textContent='同步中…';progress.classList.add('show');progress.setAttribute('aria-hidden','false');$('syncProgressText').textContent=`正在同步 ${codes.length} 类风险案例…`;try{const res=await fetch('/api/risk-map/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({risk_codes:codes,limit_per_risk:3})});const data=await res.json();if(!res.ok)throw new Error(data.detail||'同步失败');if(data.graph){payload.risks=data.graph.taxonomy||payload.risks;setGraph(data.graph);renderFilters();applyFilters();updateDataHealth(true)}const warning=data.errors?.length?`，${data.errors.length} 类未完成`:'';toast(`已同步 ${data.synced} 条案例${warning}，离线包已刷新`)}catch(e){toast(`同步失败：${e.message}`)}finally{b.textContent=old;b.disabled=false;progress.classList.remove('show');progress.setAttribute('aria-hidden','true')}}
let toastTimer;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
init();
})();
</script>
